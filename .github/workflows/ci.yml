name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Data-hygiene gate (SPEC §16.4)
        run: npm run hygiene
      - name: GSSK pin (NFR-KER-001)
        run: npm run gssk:verify
      - run: npm run lint
      - run: npm run typecheck
      - name: Unit + kernel tests
        run: npm test
      - run: npm run build
      - name: Bundle size (SPEC §16.3)
        run: npm run bundle-size

  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: E2E (shell, kernel, offline, privacy)
        run: npm run e2e
        env:
          CI: 'true'
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
