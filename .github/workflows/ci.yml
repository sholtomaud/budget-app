name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

env:
  NODE_VERSION: 22

jobs:
  build:
    name: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Rust toolchain for ml-core (rust-toolchain.toml)
        run: rustup toolchain install
      - name: Data-hygiene gate (SPEC §16.4)
        run: npm run hygiene
      - name: GSSK pin (NFR-KER-001)
        run: npm run gssk:verify
      - run: npm run lint
      - run: npm run typecheck
      - name: Build app for GitHub Pages
        run: npm run build
        env:
          BASE_PATH: /${{ github.event.repository.name }}/
      - name: Bundle size (SPEC §16.3)
        run: npm run bundle-size
      - name: Build docs (VitePress)
        run: npm run docs:build
        env:
          DOCS_BASE: /${{ github.event.repository.name }}/docs/
          APP_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/
      - name: Assemble site (app at /, docs at /docs/)
        run: |
          rm -rf site
          cp -r dist site
          cp -r docs/.vitepress/dist site/docs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  test:
    name: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - name: Rust toolchain for ml-core (rust-toolchain.toml)
        run: rustup toolchain install
      - name: ml-core (cargo test, clippy, fmt)
        run: npm run mlcore:test
      - name: Vitest (unit, kernel, property, eval, ml-core parity)
        run: npm test

  e2e:
    name: e2e
    # Tests exactly the site `build` produced, served as GitHub Pages serves
    # it (under /<repo>/, real 404s): what passes here is what deploys.
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: The site from the build job
        uses: actions/download-artifact@v4
        with:
          name: github-pages
          path: artifact
      - run: mkdir site && tar -xf artifact/artifact.tar -C site
      - name: Playwright against the built site
        run: npm run e2e
        env:
          CI: 'true'
          E2E_SITE: site
          E2E_BASE: /${{ github.event.repository.name }}/
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: |
            playwright-report/
            test-results/
          retention-days: 14

  deploy:
    name: deploy (GitHub Pages)
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: [build, test, e2e]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: pages
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    outputs:
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Pages must publish only what this workflow builds, after build, test
      # and e2e pass. With the source set to "Deploy from a branch" (the API
      # calls it "legacy"), GitHub also runs its own ungated "pages build and
      # deployment" on every push and publishes the raw repository
      # (index.html loading /src/main.ts), which breaks the live app.
      - name: Pages source is GitHub Actions
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          build_type=$(gh api "repos/${{ github.repository }}/pages" --jq .build_type)
          if [ "$build_type" != "workflow" ]; then
            echo "::error::GitHub Pages publishes from '$build_type', not this workflow. Set Settings → Pages → Build and deployment → Source to 'GitHub Actions'; otherwise every push to main also publishes the raw repository, untested."
            exit 1
          fi
      - id: deployment
        uses: actions/deploy-pages@v4

  live:
    name: live site check
    # A browser on the deployed site: the app and docs load, the kernel
    # verifies, no request fails and nothing logs an error. Screenshots are
    # kept for every run.
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - name: Playwright against the live site
        run: npx playwright test -c playwright.live.config.ts
        env:
          CI: 'true'
          LIVE_URL: ${{ needs.deploy.outputs.url }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: live-site-report
          path: |
            playwright-live-report/
            test-results/
          retention-days: 30
